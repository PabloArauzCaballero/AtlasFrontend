# Integración continua de la app del cliente (ATL-009).
#
# 38 pantallas y 6 ficheros de prueba, sin ninguna comprobación al fusionar. `yarn verify` ya
# encadena lo que el repositorio considera su mínimo; aquí simplemente se ejecuta al abrir una PR.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  static:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Ningún campo sin «qué poner», ninguna opción sin «qué significa». También corre dentro de
      # `verify` (es el primer paso del `test` de la app); aquí va aparte para que un rojo diga
      # directamente qué campo o qué opción, sin buscarlo en la salida de jest.
      - name: Ayuda de campos y opciones
        run: npm run check:field-help --workspace=atlas-consumer-app

      - name: Verificación (tipos, lint y pruebas)
        run: npm run verify

  web:
    # La misma app, exportada para el navegador. `tsc` no ve lo que rompe sólo en web (un módulo
    # nativo que no existe ahí, un `require` que lanza al evaluarse); el export sí.
    name: Export web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Exportar la web
        working-directory: apps/consumer-app
        env:
          EXPO_PUBLIC_ATLAS_API_URL: /api/v1
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web

      # Verde sólo si hay una página con la marca dentro, no sólo un exit 0.
      - name: Comprobar la salida
        working-directory: apps/consumer-app
        run: test -s dist/index.html && grep -q "Atlas" dist/index.html && ls dist/_expo/static/js/web/ | grep -q "entry-"
