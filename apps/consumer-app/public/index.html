<!DOCTYPE html>
<html lang="es-BO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <!--
      La apariencia que eligió la persona (Perfil › Apariencia), ANTES del primer pintado: si eligió
      oscuro, el documento nace oscuro y no hay destello blanco mientras llega el bundle. La clave y
      los valores son los de `src/theme/preferencia.ts` y los fondos de arranque de `src/theme/temas.ts`.
      En un archivo aparte, no en línea: la CSP del nginx de la web (`nginx.cabeceras-seguridad.conf`)
      sólo admite scripts del propio origen. Síncrono a propósito, para que corra antes de pintar.
    -->
    <script src="/apariencia.js"></script>
    <meta name="description" content="Atlas: compra hoy en los comercios afiliados y paga después, desde el navegador o desde la app." />
    <title>Atlas</title>
    <style>
      /*
        Lo que el navegador necesita para que la app se sienta como la app:
        - el documento no se desplaza en horizontal (el carrusel de la bienvenida y las hojas se
          recortan al ancho de la ventana, no lo ensanchan);
        - el fondo es el del arranque desde el primer byte, antes de que llegue el bundle: blanco, o
          casi negro si la persona eligió oscuro (`data-apariencia`). Estos valores no pueden salir
          de los tokens porque se leen antes que el JavaScript: si cambian en `temas.ts`, aquí también;
        - la raíz mide la ventana entera, que es lo que react-native-web espera para `flex: 1`.
      */
      html, body, #root { height: 100%; }
      body { margin: 0; overflow-x: hidden; background: #FFFFFF; color: #1D1D1F; -webkit-font-smoothing: antialiased; }
      html[data-apariencia='oscuro'] body { background: #0A0A0B; color: #F5F5F7; }
      #root { display: flex; }
      /* Foco visible sólo cuando se navega con teclado: el anillo de marca, no el azul del sistema. */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #0E7C7B; outline-offset: 2px; }
      html[data-apariencia='oscuro'] :focus-visible { outline-color: #67C3C1; }
    </style>
  </head>
  <body>
    <noscript>Atlas necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
