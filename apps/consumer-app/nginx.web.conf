# Plantilla de nginx para la web de la app del cliente. La imagen oficial la pasa por envsubst al
# arrancar: ${PORT} y ${ATLAS_API_ORIGIN} se fijan por entorno (Coolify del H310, Coolify de
# Contabo), no en la imagen.

# Destino y Host del reenvío de subidas (`location /almacen/`, más abajo). Vacío = no es una
# subida firmada a un host del almacén, y se rechaza.
map $request_uri $almacen_destino {
    "~^/almacen/(?<alm_esq>https?)/(?<alm_host>minio\.[A-Za-z0-9.-]+(?::[0-9]+)?)(?<alm_resto>/[^?]*\?.*X-Amz-Signature=.*)$" "$alm_esq://$alm_host$alm_resto";
    default "";
}
map $request_uri $almacen_host {
    "~^/almacen/https?/(?<alm_h>minio\.[A-Za-z0-9.-]+(?::[0-9]+)?)/" $alm_h;
    default "";
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend, en la misma red de Docker. Base relativa + proxy = sin CORS y sin dominios
    # horneados en el bundle. El PUT de fotos y PDFs va por `location /almacen/`, más abajo.
    #
    # El destino va en una VARIABLE y con el DNS de Docker como resolver: con el nombre escrito
    # en `proxy_pass`, nginx lo resuelve UNA vez al arrancar y cada redespliegue del backend (IP
    # nueva) dejaba la web contestando 502 hasta reiniciarla (medido en DEV el 2026-09-18).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $atlas_api ${ATLAS_API_ORIGIN};
    location /api/v1/ {
        # Sin URI en `proxy_pass`: con variable, nginx reenvía la petición tal cual (/api/v1/...).
        proxy_pass $atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # Las subidas de fotos y PDFs, al almacén (MinIO) con la URL firmada. En la web la app no va
    # directo (`src/api/almacen.ts`): la web va por https y el almacén de TEST por http, así que el
    # navegador bloqueaba el PUT por contenido mixto (y FortiGuard corta `*.sslip.io`). La app
    # escribe `/almacen/<esquema>/<host>/<ruta y firma>` y aquí se reenvía con el Host original,
    # que es el que cubre la firma. Se parte `$request_uri` (sin decodificar) para que la ruta
    # llegue byte a byte como se firmó.
    #
    # No es un proxy abierto: sólo PUT, sólo hosts `minio.*`, sólo con firma AWS v4 en la URL, y
    # sin la cookie ni la cabecera `Authorization` de la app.
    location /almacen/ {
        limit_except PUT { deny all; }
        if ($almacen_destino = "") { return 403; }
        proxy_pass $almacen_destino;
        proxy_http_version 1.1;
        proxy_set_header Host $almacen_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # Los bundles llevan hash en el nombre: se pueden cachear para siempre.
    location /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Una sola página: cualquier ruta (/pagos, /compra/ORD-1, /cuota/3/2) devuelve index.html y
    # expo-router la resuelve en el navegador. El HTML no se cachea para que un despliegue nuevo
    # se vea en la siguiente carga.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;
}
