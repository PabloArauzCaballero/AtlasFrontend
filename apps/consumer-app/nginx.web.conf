# Plantilla de nginx para la web de la app del cliente. La imagen oficial la pasa por envsubst al
# arrancar: ${PORT} y ${ATLAS_API_ORIGIN} se fijan por entorno (Coolify del H310, Coolify de
# Contabo), no en la imagen.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend, en la misma red de Docker. Base relativa + proxy = sin CORS y sin dominios
    # horneados en el bundle. El PUT de fotos y PDFs va a la URL firmada del almacén, no por aquí.
    location /api/v1/ {
        proxy_pass ${ATLAS_API_ORIGIN}/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # Los bundles llevan hash en el nombre: se pueden cachear para siempre.
    location /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Una sola página: cualquier ruta (/pagos, /compra/ORD-1, /cuota/3/2) devuelve index.html y
    # expo-router la resuelve en el navegador. El HTML no se cachea para que un despliegue nuevo
    # se vea en la siguiente carga.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;
}
