# Cabeceras de seguridad de la web de la app del cliente (auditoría 2026-10-09, APP-02).
#
# Se incluye en el `server` Y en cada `location` de `nginx.web.conf`: en nginx un `add_header`
# dentro de un `location` anula todos los heredados. `always` = también en 403/404/5xx.
# NO pasa por envsubst (se copia tal cual a /etc/nginx/snippets/).
#
# La CSP sale de lo que la web exportada carga DE VERDAD (inventario del bundle y de `src/`):
# - script-src 'self': el index.html sólo trae `/_expo/static/js/web/*.js` (sin scripts en línea).
#   'wasm-unsafe-eval': el lector de QR de expo-camera, en navegadores sin `BarcodeDetector`
#   nativo (Firefox, Safari), compila zxing-wasm. No habilita `eval` de JavaScript.
# - style-src 'unsafe-inline': el `<style>` del index.html y las hojas que react-native-web y
#   expo-font insertan en tiempo de ejecución.
# - img-src: data:/blob: (fotos elegidas, adjuntos leídos por la API como blob:), y las teselas
#   del mapa (`src/features/teselas.ts`: ArcGIS y CARTO).
# - connect-src: la API es del mismo origen (/api/v1) y las subidas van por /almacen/ (mismo
#   origen); blob:/data: porque `src/device/archivos.ts` lee las fotos con fetch(blob:);
#   fastly.jsdelivr.net es de donde zxing-wasm descarga su .wasm (versión fijada en el paquete).
# - font-src: las fuentes (Manrope, Sora) van empaquetadas en /assets.
# - media-src: sonidos de marca empaquetados; blob: para la vista previa de la cámara.
# - frame-ancestors 'self' + X-Frame-Options SAMEORIGIN: ningún OTRO sitio puede enmarcar la app
#   (clickjacking). No 'none': la bienvenida en escritorio (`src/web/HeroBienvenida.tsx`) muestra la
#   propia app dentro de un iframe del mismo origen (`/bienvenida?marco=telefono`), y con 'none'
#   ese marco salía bloqueado (comprobado en navegador el 2026-10-09).
# Sin `upgrade-insecure-requests`: TEST también se sirve por http en la IP en bruto, y la
# directiva forzaría https en el mismo origen y rompería esa entrada.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.basemaps.cartocdn.com; font-src 'self' data:; connect-src 'self' blob: data: https://fastly.jsdelivr.net; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Cámara: selfie, carnet y QR. Ubicación: la app la pide (expo-location usa navigator.geolocation).
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), display-capture=()" always;
# Por http el navegador lo ignora; por https (atlas.consumerweb.test.arauzsoftware.com) fija https
# un año. Sin includeSubDomains: otros subdominios pueden seguir siendo http.
add_header Strict-Transport-Security "max-age=31536000" always;
